name: Build ZENO APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project (unzip any uploaded ZIP)
        run: |
          find . -iname "*.zip" -not -path './.git/*' -not -path './project_src/*' | while read -r z; do
            echo "Unzipping: $z"
            unzip -q -o "$z" -d project_src || true
          done
          SETTINGS=$(find . \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' | head -n1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: no settings.gradle(.kts) found. Repo contents:"
            find . -not -path './.git/*' -not -path './.git' | head -80
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "Project folder: $DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e
          gradle assembleDebug --console=plain > build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "=== ERRORS (summary) ==="
            grep -nE "^e: |error:|What went wrong|Could not|Execution failed|Unresolved|Caused by" build.log | head -40
            echo "=== LAST 40 LINES ==="
            tail -n 40 build.log
          fi
          exit $STATUS

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.PROJECT_DIR }}/build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ZENO-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
